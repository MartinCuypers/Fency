name: APK Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write   # publication de l'APK dans la release « latest »
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Interface web embarquée dans l'APK
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Hébergement des plans : variables du dépôt (Settings > Secrets and variables > Actions > Variables).
          # Vides : stockage local sur l'appareil.
          VITE_FENCY_BACKEND: ${{ vars.FENCY_BACKEND }}
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_FENCY_PUBLIC_URL: ${{ vars.FENCY_PUBLIC_URL }}

      # Test de bout en bout du moteur RTK (RTKLIB + pont) sur PC
      - name: Test du moteur RTK natif
        run: |
          git clone --depth 1 --branch b34k https://github.com/rtklibexplorer/RTKLIB /tmp/rtklib
          cmake -S android/app/src/main/cpp -B /tmp/rtkbuild -DRTKLIB_DIR=/tmp/rtklib
          cmake --build /tmp/rtkbuild -j4
          cd /tmp/rtkbuild && ctest --output-on-failure

      # APK (le SDK et le NDK Android sont préinstallés sur les runners GitHub)
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires et APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fency-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Adresse stable de téléchargement direct, sans compte GitHub :
      # https://github.com/<proprietaire>/<depot>/releases/latest/download/fency.apk
      - name: Publier l'APK (release « latest »)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk fency.apk
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest fency.apk --target "$GITHUB_SHA" --latest \
            --title "Fency (dernière version)" \
            --notes "APK de débogage compilé depuis $GITHUB_SHA. À installer en autorisant les sources inconnues."
